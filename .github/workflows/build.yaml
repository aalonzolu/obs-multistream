name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'data/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'buildspec.json'
      - 'installer/**'
      - '.github/workflows/build.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MULTISTREAM_GOOGLE_CLIENT_ID: ${{ secrets.MULTISTREAM_GOOGLE_CLIENT_ID }}
  MULTISTREAM_GOOGLE_CLIENT_SECRET: ${{ secrets.MULTISTREAM_GOOGLE_CLIENT_SECRET }}
  MULTISTREAM_META_BROKER_URL: ${{ vars.MULTISTREAM_META_BROKER_URL }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar dependencias de OBS
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-windows-${{ hashFiles('buildspec.json') }}

      - name: Configurar
        shell: pwsh
        run: |
          cmake --preset windows-ci-x64 `
            "-DMULTISTREAM_GOOGLE_CLIENT_ID=$env:MULTISTREAM_GOOGLE_CLIENT_ID" `
            "-DMULTISTREAM_GOOGLE_CLIENT_SECRET=$env:MULTISTREAM_GOOGLE_CLIENT_SECRET" `
            "-DMULTISTREAM_META_BROKER_URL=$env:MULTISTREAM_META_BROKER_URL"

      - name: Compilar
        shell: pwsh
        run: cmake --build --preset windows-ci-x64 --parallel -- /consoleLoggerParameters:Summary /noLogo

      - name: Empaquetar
        shell: pwsh
        run: cmake --install build_x64 --prefix release/obs-multistream --config RelWithDebInfo

      - name: Instalador
        shell: pwsh
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\release\obs-multistream" "/DOutputDir=$PWD\installer-out" installer\windows\multistream.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: obs-multistream-windows-x64-${{ github.sha }}
          path: release/obs-multistream
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: obs-multistream-windows-installer-${{ github.sha }}
          path: installer-out/*.exe
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar dependencias de OBS
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('buildspec.json') }}

      - name: Configurar
        run: |
          cmake --preset macos-ci \
            -DENABLE_CCACHE=OFF \
            "-DMULTISTREAM_GOOGLE_CLIENT_ID=$MULTISTREAM_GOOGLE_CLIENT_ID" \
            "-DMULTISTREAM_GOOGLE_CLIENT_SECRET=$MULTISTREAM_GOOGLE_CLIENT_SECRET" \
            "-DMULTISTREAM_META_BROKER_URL=$MULTISTREAM_META_BROKER_URL"

      - name: Compilar
        run: cmake --build --preset macos-ci --parallel

      - name: Empaquetar
        run: |
          mkdir -p release
          ditto build_macos/RelWithDebInfo/obs-multistream.plugin release/obs-multistream.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: obs-multistream-macos-${{ github.sha }}
          path: release
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config build-essential rsync git \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev \
            libcurl4-openssl-dev libsimde-dev libjansson-dev zlib1g-dev uuid-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libsecret-1-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xinput-dev \
            libgl1-mesa-dev libegl-dev libwayland-dev libpci-dev libvpl-dev \
            extra-cmake-modules libxkbcommon-dev libxcb-xfixes0-dev libxcb-composite0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libudev-dev libdrm-dev libvulkan-dev uthash-dev libpulse-dev libasound2-dev libspeexdsp-dev libfreetype-dev libfontconfig-dev libv4l-dev libxcomposite-dev libxdamage-dev libxss-dev libx264-dev libmbedtls-dev librist-dev libsrt-openssl-dev libpipewire-0.3-dev

      - name: Versión de OBS
        id: obs
        run: echo "version=$(jq -r '.dependencies["obs-studio"].version' buildspec.json)" >> "$GITHUB_OUTPUT"

      - name: Caché de libobs
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: ~/obs-sdk
          key: obs-sdk-ubuntu-24.04-${{ steps.obs.outputs.version }}

      - name: Compilar libobs
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.obs.outputs.version }}" https://github.com/obsproject/obs-studio.git "$RUNNER_TEMP/obs-studio"
          cmake -S "$RUNNER_TEMP/obs-studio" -B "$RUNNER_TEMP/obs-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/obs-sdk" \
            -DENABLE_UI=OFF -DENABLE_FRONTEND=OFF -DENABLE_PLUGINS=OFF -DENABLE_SCRIPTING=OFF \
            -DENABLE_WEBSOCKET=OFF -DENABLE_BROWSER=OFF -DENABLE_NEW_MPEGTS_OUTPUT=OFF -DENABLE_AJA=OFF \
            -DENABLE_VLC=OFF -DENABLE_WAYLAND=OFF -DENABLE_PIPEWIRE=OFF
          cmake --build "$RUNNER_TEMP/obs-build" --parallel
          cmake --install "$RUNNER_TEMP/obs-build"

      - name: Configurar
        run: |
          cmake --preset ubuntu-ci-x86_64 \
            -DENABLE_CCACHE=OFF \
            "-DCMAKE_PREFIX_PATH=$HOME/obs-sdk" \
            "-DMULTISTREAM_GOOGLE_CLIENT_ID=$MULTISTREAM_GOOGLE_CLIENT_ID" \
            "-DMULTISTREAM_GOOGLE_CLIENT_SECRET=$MULTISTREAM_GOOGLE_CLIENT_SECRET" \
            "-DMULTISTREAM_META_BROKER_URL=$MULTISTREAM_META_BROKER_URL"

      - name: Compilar
        run: cmake --build --preset ubuntu-ci-x86_64 --parallel

      - name: Empaquetar
        run: scripts/package-linux.sh release/obs-multistream

      - uses: actions/upload-artifact@v4
        with:
          name: obs-multistream-linux-x64-${{ github.sha }}
          path: release
          if-no-files-found: error

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Armar los paquetes
        run: |
          version="${GITHUB_REF_NAME}"
          windows="artifacts/obs-multistream-windows-x64-${GITHUB_SHA}"
          macos="artifacts/obs-multistream-macos-${GITHUB_SHA}"
          linux="artifacts/obs-multistream-linux-x64-${GITHUB_SHA}"
          cp artifacts/obs-multistream-windows-installer-${GITHUB_SHA}/*.exe "obs-multistream-${version}-windows-x64-instalador.exe"
          find "$windows" -name '*.pdb' -delete
          (cd "$windows" && zip -qr "$GITHUB_WORKSPACE/obs-multistream-${version}-windows-x64.zip" obs-multistream)
          ditto -c -k --keepParent "$macos/obs-multistream.plugin" "obs-multistream-${version}-macos.zip"
          (cd "$linux" && zip -qr "$GITHUB_WORKSPACE/obs-multistream-${version}-linux-x64.zip" obs-multistream)

      - name: Crear la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" obs-multistream-*.zip obs-multistream-*.exe \
            --title "Multistream $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
