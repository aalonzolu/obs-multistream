<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Volviendo a OBS · Multistream</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23E5243B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../legal.css">
</head>
<body>
<main class="wrap">
  <article>
    <h1 id="title">Volviendo a OBS…</h1>
    <p id="message">Si no pasa nada en unos segundos, volvé a OBS y conectá Facebook otra vez.</p>
  </article>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const port = Number((params.get("state") || "").split(".")[0]);
  if (Number.isInteger(port) && port >= 1024 && port <= 65535) {
    location.replace(`http://127.0.0.1:${port}/facebook${location.search}`);
  } else {
    document.getElementById("title").textContent = "Este enlace no viene de Multistream";
    document.getElementById("message").textContent = "Abrí OBS y usá «Conectar…» en Facebook para empezar de nuevo.";
  }
</script>
</body>
</html>
